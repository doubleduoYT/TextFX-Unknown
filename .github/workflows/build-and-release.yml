name: Build and publish preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download compile-only BepInEx and Unity references
        run: python3 scripts/download_references.py
      - name: Validate curated dialogue metadata
        run: python3 scripts/test_curated_mapping.py
      - name: Validate 50 effect tags
        run: python3 scripts/test_effect_catalog.py
      - name: Verify original-glyph geometry safeguards
        run: python3 scripts/test_geometry_safety.py
      - name: Validate locale JSON rewriting
        run: python3 scripts/test_locale_converter.py
      - name: Test entrance versus persistent effect lifetimes
        run: python3 scripts/test_sustain_effects.py
      - name: Verify HUD exclusion and dialogue sanitation
        run: python3 scripts/test_hud_safety.py
      - name: Verify previous dialogue glyphs are cleared
        run: python3 scripts/test_previous_dialogue_cleanup.py
      - name: Compile actual mod DLL
        run: dotnet build src/TextFXUnknown.csproj -c Release --nologo
      - name: Package DLL and source only (exclude README)
        run: python3 scripts/package.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextFX-Unknown-v0.7.6-pre.1
          path: dist/TextFX-Unknown-v0.7.6-pre.1.zip
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.6-pre.1
          target_commitish: ${{ github.sha }}
          name: TextFX Unknown v0.7.6 Preview 1
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: dist/TextFX-Unknown-v0.7.6-pre.1.zip
          fail_on_unmatched_files: true